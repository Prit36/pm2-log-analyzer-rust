[package]
name = "pm2-log-analyzer"
version = "0.2.0"
edition = "2024"
description = "High performance native Windows PM2 log analyzer in modern Rust 2024"

[lib]
name = "pm2_log_analyzer"
path = "src/lib.rs"

[[bin]]
name = "pm2-log-analyzer"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "parity_runner"
path = "src/bin/parity_runner.rs"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
dioxus-desktop = "0.6"
tokio = { version = "1.40", features = ["rt-multi-thread", "time", "sync"] }
arboard = "3.4"
rayon = "1.12"
memmap2 = "0.9"
memchr = "2.8"
hashbrown = "0.17"
rapidhash = "4"
rfd = { version = "0.15", default-features = false }
csv = "1.4"
rust_xlsxwriter = { version = "0.97", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
mimalloc = "0.1"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }

[dev-dependencies]
zip = "8.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

