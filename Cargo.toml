[package]
name = "pm2-log-analyzer"
version = "0.2.0"
edition = "2024"
description = "High performance native Windows PM2 log analyzer in modern Rust 2024"

[lib]
name = "pm2_log_analyzer"
path = "src/lib.rs"

[[bin]]
name = "pm2-log-analyzer"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31"
egui_plot = "0.31"
rayon = "1.12"
memmap2 = "0.9"
memchr = "2.8"
rapidhash = "1.4"
rfd = "0.15"
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
