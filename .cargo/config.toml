[target.x86_64-pc-windows-gnu]
rustflags = [
    "-L", "native=C:/Users/My_Home/Desktop/projects/pm2-logs/pm2-log-analyzer-rust/.cargo/lib",
    "-C", "link-arg=-lunwind"
]

# Statically link the MSVC CRT so the release exe is a single standalone
# binary that needs no VC++ redistributable or companion DLLs.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]


